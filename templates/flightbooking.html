<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Booking – SkyBook</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.45);
      --glass-border: rgba(255, 255, 255, 0.6);
      --primary-blue: #0284c7;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
      background-attachment: fixed;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* Glass Container */
    .container {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.1);
      width: 100%;
      max-width: 650px;
      padding: 40px;
      border-radius: 24px;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 30px;
      letter-spacing: -0.5px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 8px;
      color: #475569;
      margin-left: 4px;
    }

    input, select {
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 12px;
      font-size: 15px;
      background: rgba(255, 255, 255, 0.5);
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      border-color: var(--primary-blue);
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1);
    }

    /* Readonly styling for professionalism */
    input[readonly] {
      background: rgba(241, 245, 249, 0.5);
      cursor: default;
      color: #64748b;
    }

    .total-box {
      background: rgba(34, 197, 94, 0.15) !important;
      border: 1px solid rgba(34, 197, 94, 0.3) !important;
      font-weight: 700;
      font-size: 18px;
      color: #15803d !important;
      text-align: right;
    }

    button {
      width: 100%;
      padding: 16px;
      background: var(--primary-blue);
      color: #fff;
      border: none;
      font-size: 16px;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      margin-top: 25px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    button:hover {
      background: #0369a1;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
    }

    footer {
      margin-top: 30px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Responsive Design */
    @media (max-width: 600px) {
      .container { padding: 25px; }
      .form-grid { grid-template-columns: 1fr; gap: 15px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Flight Ticket Booking</h1>

    <form id="bookingForm">
      <div class="form-grid">
        <div class="form-group">
          <label>Flight Number</label>
          <input type="text" id="flightNo" readonly>
        </div>

        <div class="form-group">
          <label>Airline</label>
          <input type="text" id="airline" readonly>
        </div>

        <div class="form-group">
          <label>From</label>
          <input type="text" id="from" readonly>
        </div>

        <div class="form-group">
          <label>To</label>
          <input type="text" id="to" readonly>
        </div>

        <div class="form-group">
          <label>Departure Date</label>
          <input type="date" id="departure" required>
        </div>

        <div class="form-group">
          <label>Return Date (Optional)</label>
          <input type="date" id="returnDate">
        </div>

        <div class="form-group">
          <label>Travel Class</label>
          <select id="class">
            <option value="Economy">Economy</option>
            <option value="Business">Business</option>
            <option value="First Class">First Class</option>
          </select>
        </div>

        <div class="form-group">
          <label>Passengers</label>
          <input type="number" id="passengers" min="1" value="1">
        </div>

        <div class="form-group">
          <label>Base Price (Per passenger)</label>
          <input type="text" id="price" readonly>
        </div>

        <div class="form-group">
          <label>Total Payable Amount</label>
          <input type="text" id="total" class="total-box" readonly>
        </div>
      </div>

      <button type="submit">Confirm & Generate Receipt</button>
    </form>
  </div>

  <footer>
    <p>© 2026 SkyBook. All rights reserved. | Professional Travel Management</p>
  </footer>

<script>
  const classRate = { 
    "Economy": 1, 
    "Business": 1.5, 
    "First Class": 2 
  };

  // 1. INITIALIZE DATA
  window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    
    // Auto-fill from URL
    const fields = ['flightNo', 'airline', 'from', 'to'];
    fields.forEach(field => {
      if(urlParams.has(field)) document.getElementById(field).value = urlParams.get(field);
    });
    
    // Clean and set Price
    if(urlParams.has('price')) {
      let rawPrice = urlParams.get('price').replace(/[^\d.]/g, ''); 
      document.getElementById("price").value = rawPrice;
    }

    calculateTotal();
  };

  // 2. CALCULATION LOGIC
  function calculateTotal() {
    const price = Number(document.getElementById("price").value) || 0;
    const passengers = Number(document.getElementById("passengers").value) || 1;
    const travelClass = document.getElementById("class").value;

    const total = price * passengers * classRate[travelClass];
    
    document.getElementById("total").value = total.toLocaleString('en-IN', {
      style: 'currency',
      currency: 'INR',
      maximumFractionDigits: 0
    });
  }

  // Live Listeners
  document.getElementById("passengers").addEventListener("input", calculateTotal);
  document.getElementById("class").addEventListener("change", calculateTotal);

  // 3. SUBMISSION & STORAGE
  document.getElementById("bookingForm").addEventListener("submit", (e) => {
    e.preventDefault();

    const bookingId = "SKB-" + Math.floor(100000 + Math.random() * 900000);
    
    // Data Object for Receipt
    const formData = {
      bookingId: bookingId,
      flightNo: document.getElementById("flightNo").value,
      airline: document.getElementById("airline").value,
      from: document.getElementById("from").value,
      to: document.getElementById("to").value,
      departure: document.getElementById("departure").value,
      returnDate: document.getElementById("returnDate").value,
      travelClass: document.getElementById("class").value,
      passengers: document.getElementById("passengers").value,
      total: document.getElementById("total").value
    };

    // Professional Logging/Storage
    saveToLiveBookings(formData);

    // Redirect to receipt page
    const params = new URLSearchParams(formData);
    window.location.href = "/flightreceipt1?" + params.toString();
  });

  function saveToLiveBookings(data) {
    const logEntry = {
      id: data.bookingId,
      customer: "Guest User",
      type: "Flight",
      destination: data.to,
      timestamp: new Date().toLocaleTimeString(),
      status: "Confirmed"
    };

    const logs = JSON.parse(localStorage.getItem('liveBookings') || "[]");
    logs.push(logEntry);
    localStorage.setItem('liveBookings', JSON.stringify(logs));
    localStorage.setItem('lastUpdate', Date.now());
  }
</script>
</body>
</html>
